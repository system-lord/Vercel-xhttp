<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLESS XHTTP Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="glass rounded-3xl p-6 mb-8 flex justify-between items-center border-b-4 border-blue-500">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-l from-blue-400 to-cyan-400 bg-clip-text text-transparent">پنل مدیریت xHTTP</h1>
                <p class="text-gray-400 text-sm">وضعیت سرور: <span class="text-green-400">آنلاین</span></p>
            </div>
            <button onclick="addUser()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-xl transition-all shadow-lg shadow-blue-900/20">
                <i class="fas fa-plus ml-2"></i>کاربر جدید
            </button>
        </div>

        <div class="glass rounded-2xl p-6 mb-8">
            <label class="block text-gray-400 mb-2 mr-1">آدرس سرور شما (Vercel Domain):</label>
            <input id="hostInput" type="text" placeholder="example.vercel.app" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-left dir-ltr focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <div id="userList" class="grid gap-4">
            </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('vless_users') || '[]');

        function save() {
            localStorage.setItem('vless_users', JSON.stringify(users));
            render();
        }

        function addUser() {
            const id = self.crypto.randomUUID();
            users.push({ id, name: 'کاربر ' + (users.length + 1) });
            save();
        }

        function deleteUser(index) {
            users.splice(index, 1);
            save();
        }

        function getConfig(uuid) {
            const host = document.getElementById('hostInput').value || window.location.host;
            const config = {
                "remarks": "VLESS-XHTTP-" + host,
                "outbounds": [{
                    "protocol": "vless",
                    "settings": {
                        "vnext": [{
                            "address": "vercel.com",
                            "port": 443,
                            "users": [{ "id": uuid, "encryption": "none" }]
                        }]
                    },
                    "streamSettings": {
                        "network": "xhttp",
                        "security": "tls",
                        "xhttpSettings": { "path": "/", "host": host, "mode": "packet-up" },
                        "tlsSettings": { "serverName": "vercel.com", "allowInsecure": true }
                    }
                }]
            };
            return JSON.stringify(config, null, 2);
        }

        function copyConfig(uuid) {
            navigator.clipboard.writeText(getConfig(uuid));
            alert('کانفیگ کپی شد!');
        }

        function render() {
            const container = document.getElementById('userList');
            container.innerHTML = users.map((user, index) => `
                <div class="glass rounded-2xl p-5 flex flex-col md:flex-row justify-between items-center gap-4 border-r-4 border-cyan-500">
                    <div class="flex-1 text-right w-full">
                        <h3 class="font-bold">${user.name}</h3>
                        <p class="text-xs text-gray-500 font-mono mt-1">${user.id}</p>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button onclick="copyConfig('${user.id}')" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 px-4 rounded-lg transition-colors">کپی کانفیگ</button>
                        <button onclick="deleteUser(${index})" class="text-red-400 hover:bg-red-500/10 p-2 rounded-lg transition-colors"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
